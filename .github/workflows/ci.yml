name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: civicsync
          POSTGRES_PASSWORD: civicsync
          POSTGRES_DB: civicsync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicsync"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # CI talks to the service container on 5432. Locally the stack is on 5433 to avoid
      # colliding with a Homebrew PostgreSQL — see docker-compose.yml.
      DB_URL: postgres://civicsync:civicsync@localhost:5432/civicsync?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Install tooling
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migrations are reversible
        run: make migrate-redo

      # The Makefile targets run psql inside Docker Compose, which does not exist here.
      # CI has a service container instead, so the guards are invoked directly.
      - name: Tenant isolation guard
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f ops/checks/check_rls.sql

      - name: No file content in the database
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f ops/checks/check_no_blobs.sql

      - name: Layer guard
        run: make check-layers

      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: api

      - name: Tests
        run: make test

      - name: Build
        run: make build
